name: rene
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rene
      POSTGRES_DB: rene
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rene -d rene"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["sh", "-c", "npm run db:migrate && exec node apps/server/dist/index.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      COOKIE_SECURE: "true"
      WEB_ORIGIN: https://${RENE_DOMAIN:?Set RENE_DOMAIN}
      TRUST_PROXY: ${RENE_NETWORK_SUBNET:-172.30.92.0/24}
      DATABASE_URL: postgresql://rene:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/rene?schema=public
      LIVEKIT_URL: wss://${VOICE_DOMAIN:?Set VOICE_DOMAIN}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
    networks: [database, realtime]
    depends_on:
      postgres: { condition: service_healthy }
      livekit: { condition: service_started }
    logging: *logging
  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./deploy/generated/livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7881:7881/tcp", "7882:7882/udp", "3478:3478/udp"]
    networks: [realtime]
    logging: *logging
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    ports: ["80:80/tcp", "443:443/tcp"]
    volumes:
      - ./deploy/generated/caddy.json:/etc/caddy/caddy.json:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [realtime]
    depends_on:
      app: { condition: service_healthy }
      livekit: { condition: service_started }
    logging: *logging
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  database:
    internal: true
  realtime:
    ipam:
      config:
        - subnet: ${RENE_NETWORK_SUBNET:-172.30.92.0/24}
