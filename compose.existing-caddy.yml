name: rene
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rene
      POSTGRES_DB: rene
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.caddy}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rene -d rene"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["sh", "-c", "npm run db:migrate && exec node apps/server/dist/index.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      COOKIE_SECURE: "true"
      WEB_ORIGIN: https://${RENE_DOMAIN:?Set RENE_DOMAIN}
      TRUST_PROXY: ${RENE_TRUST_PROXY:?Set RENE_TRUST_PROXY to the proxy address or subnet}
      DATABASE_URL: postgresql://rene:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/rene?schema=public
      LIVEKIT_URL: wss://${VOICE_DOMAIN:?Set VOICE_DOMAIN}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
    expose: ["8080"]
    ports: ["${RENE_BIND_ADDRESS:-127.0.0.1}:${RENE_HTTP_PORT:-8080}:8080"]
    networks: [database, realtime]
    depends_on:
      postgres: { condition: service_healthy }
      livekit: { condition: service_started }
    # /health checks the compiled application; database readiness is checked above.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging
  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./deploy/generated/livekit.existing-caddy.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "${RENE_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks: [realtime]
    logging: *logging
volumes:
  postgres_data:
networks:
  database:
    internal: true
  realtime:
    ipam:
      config:
        - subnet: ${RENE_NETWORK_SUBNET:-172.30.93.0/24}
